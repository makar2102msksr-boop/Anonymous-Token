<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anonymous Token — Solana Presale</title>

<meta
  name="description"
  content="Anonymous Token — a community-driven token built on Solana."
>

<style>
:root{
  --black:#010302;
  --black2:#040705;
  --panel:#080d0a;
  --panel2:#0b120e;

  --green:#00ff88;
  --green2:#00c96b;
  --green3:#8affc6;
  --green4:#c4ffdf;

  --white:#f5fff9;
  --text:#dce8e1;
  --muted:#75837c;

  --border:rgba(0,255,136,.14);
  --border2:rgba(255,255,255,.07);

  --danger:#ff526f;

  --max:1180px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 15% 5%,
      rgba(0,255,136,.12),
      transparent 27%
    ),
    radial-gradient(
      circle at 90% 25%,
      rgba(0,255,136,.055),
      transparent 27%
    ),
    linear-gradient(
      180deg,
      #010302 0%,
      #030604 48%,
      #010201 100%
    );

  color:var(--white);

  min-height:100vh;

  overflow-x:hidden;
}

body::before{
  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  z-index:-5;

  background-image:
    linear-gradient(
      rgba(0,255,136,.023) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0,255,136,.023) 1px,
      transparent 1px
    );

  background-size:
    56px 56px;

  mask-image:
    linear-gradient(
      to bottom,
      black,
      transparent 92%
    );
}

body::after{
  content:"";

  position:fixed;

  inset:0;

  z-index:-4;

  pointer-events:none;

  background:
    radial-gradient(
      circle at center,
      transparent 40%,
      rgba(0,0,0,.75) 100%
    );
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.container{
  width:
    min(
      var(--max),
      calc(100% - 40px)
    );

  margin:auto;
}

/* =========================================================
   BACKGROUND
========================================================= */

#particles{
  position:fixed;

  inset:0;

  overflow:hidden;

  pointer-events:none;

  z-index:-3;
}

.particle{
  position:absolute;

  width:2px;
  height:2px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 10px var(--green);

  animation:
    particleFloat
    linear
    infinite;
}

@keyframes particleFloat{
  from{
    transform:
      translateY(110vh)
      translateX(0);
  }

  to{
    transform:
      translateY(-20vh)
      translateX(80px);
  }
}

/* =========================================================
   HEADER
========================================================= */

header{
  position:fixed;

  top:0;
  left:0;

  width:100%;

  z-index:1000;

  border-bottom:
    1px solid
    rgba(255,255,255,.055);

  background:
    rgba(1,3,2,.76);

  backdrop-filter:
    blur(24px);
}

.nav{
  height:82px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:18px;
}

.logo{
  display:flex;

  align-items:center;

  gap:12px;

  font-weight:950;

  font-size:18px;

  letter-spacing:-.5px;
}

.logo-mark{
  width:42px;
  height:42px;

  display:grid;

  place-items:center;

  border-radius:11px;

  color:#001208;

  font-weight:1000;

  background:
    linear-gradient(
      145deg,
      #c4ffdf,
      var(--green),
      #008d4c
    );

  box-shadow:
    0 0 25px
    rgba(0,255,136,.3);

  position:relative;

  overflow:hidden;
}

.logo-mark::after{
  content:"";

  position:absolute;

  width:60px;
  height:10px;

  background:
    rgba(255,255,255,.6);

  transform:
    rotate(-45deg)
    translateX(-55px);

  animation:
    logoShine
    4.5s
    infinite;
}

@keyframes logoShine{
  0%,65%{
    transform:
      rotate(-45deg)
      translateX(-60px);
  }

  90%,100%{
    transform:
      rotate(-45deg)
      translateX(75px);
  }
}

nav{
  display:flex;

  gap:30px;
}

nav a{
  color:#89978f;

  font-size:13px;

  font-weight:700;

  transition:.2s;
}

nav a:hover{
  color:var(--green);
}

.nav-actions{
  display:flex;

  align-items:center;

  gap:9px;
}

.language{
  padding:
    10px 12px;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:10px;

  color:white;

  background:
    rgba(255,255,255,.03);

  cursor:pointer;
}

.wallet-btn{
  padding:
    12px 18px;

  border:0;

  border-radius:11px;

  cursor:pointer;

  color:#001208;

  font-weight:950;

  background:
    linear-gradient(
      135deg,
      #c4ffdf,
      var(--green)
    );

  box-shadow:
    0 0 28px
    rgba(0,255,136,.17);

  transition:.25s;
}

.wallet-btn:hover{
  transform:
    translateY(-2px);

  box-shadow:
    0 0 40px
    rgba(0,255,136,.32);
}

/* =========================================================
   HERO
========================================================= */

.hero{
  min-height:900px;

  padding-top:150px;

  display:flex;

  align-items:center;

  position:relative;

  overflow:hidden;
}

.hero-content{
  width:100%;

  position:relative;

  z-index:3;

  text-align:center;
}

.eyebrow{
  display:inline-flex;

  align-items:center;

  gap:9px;

  padding:
    8px 14px;

  border:
    1px solid
    rgba(0,255,136,.2);

  border-radius:999px;

  color:#b4ffda;

  background:
    rgba(0,255,136,.04);

  font-size:11px;

  font-weight:900;

  text-transform:uppercase;

  letter-spacing:1.5px;

  animation:
    fadeUp .7s ease both;
}

.status-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:
    var(--green);

  box-shadow:
    0 0 15px
    var(--green);

  animation:
    pulse 1.6s infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.45;
    transform:scale(.7);
  }
}

.hero h1{
  max-width:1050px;

  margin:
    30px auto 0;

  font-size:
    clamp(
      52px,
      9vw,
      108px
    );

  line-height:.88;

  letter-spacing:-6px;

  font-weight:1000;

  animation:
    fadeUp .9s ease both;
}

.hero h1 span{
  display:block;
}

.green-text{
  background:
    linear-gradient(
      90deg,
      #f0fff6,
      #9affc9 33%,
      var(--green) 72%,
      #55ffac
    );

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;

  text-shadow:
    0 0 45px
    rgba(0,255,136,.15);
}

.hero-description{
  max-width:680px;

  margin:
    32px auto 0;

  color:
    var(--muted);

  font-size:17px;

  line-height:1.8;

  animation:
    fadeUp 1s ease both;
}

.hero-buttons{
  margin-top:38px;

  display:flex;

  justify-content:center;

  gap:13px;

  flex-wrap:wrap;

  animation:
    fadeUp 1.1s ease both;
}

.primary-btn,
.secondary-btn{
  padding:
    16px 26px;

  border-radius:13px;

  font-weight:950;

  cursor:pointer;

  transition:.25s;
}

.primary-btn{
  color:#001208;

  background:
    linear-gradient(
      135deg,
      #c8ffe3,
      var(--green)
    );

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 15px 50px
    rgba(0,255,136,.19);
}

.primary-btn:hover{
  transform:
    translateY(-3px);

  box-shadow:
    0 20px 60px
    rgba(0,255,136,.31);
}

.secondary-btn{
  color:white;

  background:
    rgba(255,255,255,.03);

  border:
    1px solid
    rgba(255,255,255,.09);
}

.secondary-btn:hover{
  border-color:
    rgba(0,255,136,.3);

  color:
    var(--green3);
}

/* =========================================================
   MASK
========================================================= */

.mask-stage{
  position:absolute;

  width:650px;
  height:650px;

  left:50%;
  top:52%;

  transform:
    translate(-50%,-50%);

  z-index:-1;

  pointer-events:none;
}

.orbit{
  position:absolute;

  inset:0;

  border:
    1px solid
    rgba(0,255,136,.075);

  border-radius:50%;

  animation:
    orbitRotate
    28s linear infinite;
}

.orbit::before,
.orbit::after{
  content:"";

  position:absolute;

  border-radius:50%;

  background:
    var(--green);

  box-shadow:
    0 0 30px
    var(--green);
}

.orbit::before{
  width:9px;
  height:9px;

  left:49%;
  top:10%;
}

.orbit::after{
  width:6px;
  height:6px;

  right:10%;
  bottom:23%;
}

@keyframes orbitRotate{
  from{
    transform:
      rotate(0deg);
  }

  to{
    transform:
      rotate(360deg);
  }
}

.mask{
  position:absolute;

  left:50%;
  top:50%;

  width:320px;
  height:280px;

  transform:
    translate(-50%,-50%);

  opacity:.16;

  filter:
    drop-shadow(
      0 0 40px
      rgba(0,255,136,.75)
    );

  animation:
    maskFloat
    5.5s ease-in-out infinite;
}

.mask-face{
  position:absolute;

  inset:
    18px 25px;

  background:
    linear-gradient(
      145deg,
      #d6ffe7,
      rgba(76,255,157,.7) 42%,
      rgba(0,255,136,.18)
    );

  clip-path:
    polygon(
      13% 10%,
      34% 1%,
      50% 6%,
      66% 1%,
      87% 10%,
      98% 34%,
      91% 65%,
      78% 88%,
      60% 98%,
      50% 91%,
      40% 98%,
      22% 88%,
      9% 65%,
      2% 34%
    );
}

.eye{
  position:absolute;

  top:100px;

  width:78px;
  height:25px;

  background:#00130a;

  clip-path:
    polygon(
      0 40%,
      45% 0,
      100% 38%,
      72% 100%,
      25% 86%
    );

  box-shadow:
    0 0 20px
    var(--green);
}

.eye.left{
  left:55px;
}

.eye.right{
  right:55px;

  transform:
    scaleX(-1);
}

.mask-mouth{
  position:absolute;

  width:110px;
  height:38px;

  left:50%;
  bottom:64px;

  transform:
    translateX(-50%);

  border-bottom:
    4px solid
    #00130a;

  border-radius:
    0 0 100px 100px;
}

@keyframes maskFloat{
  0%,100%{
    transform:
      translate(-50%,-50%)
      translateY(0)
      rotate(-1deg);
  }

  50%{
    transform:
      translate(-50%,-50%)
      translateY(-15px)
      rotate(1deg);
  }
}

/* =========================================================
   PRESALE
========================================================= */

.presale-wrap{
  margin-top:-70px;

  position:relative;

  z-index:10;
}

.presale{
  padding:32px;

  border-radius:23px;

  border:
    1px solid
    rgba(0,255,136,.15);

  background:
    linear-gradient(
      135deg,
      rgba(0,255,136,.06),
      rgba(255,255,255,.017)
    ),
    rgba(5,10,7,.9);

  backdrop-filter:
    blur(25px);

  box-shadow:
    0 35px 110px
    rgba(0,0,0,.5);
}

.presale-top{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  margin-bottom:25px;
}

.presale-title{
  font-size:24px;

  font-weight:950;
}

.presale-subtitle{
  margin-top:7px;

  color:
    var(--muted);

  font-size:13px;
}

.live{
  display:flex;

  align-items:center;

  gap:8px;

  color:
    var(--green);

  font-size:11px;

  font-weight:950;

  letter-spacing:1px;
}

.progress-info{
  display:flex;

  justify-content:space-between;

  gap:15px;

  margin-bottom:10px;

  color:
    #839088;

  font-size:12px;
}

.progress{
  width:100%;
  height:11px;

  overflow:hidden;

  border-radius:999px;

  background:
    rgba(255,255,255,.06);

  position:relative;
}

.progress-bar{
  width:0%;

  height:100%;

  border-radius:inherit;

  background:
    linear-gradient(
      90deg,
      #00a95b,
      var(--green),
      #b6ffd4
    );

  box-shadow:
    0 0 30px
    rgba(0,255,136,.55);

  transition:
    width .9s cubic-bezier(.2,.8,.2,1);

  position:relative;
}

.progress-bar::after{
  content:"";

  position:absolute;

  right:0;

  top:0;

  width:80px;

  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.75)
    );

  opacity:.7;
}

.presale-live-stats{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;

  margin-top:18px;
}

.live-stat{
  padding:16px;

  border-radius:13px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid
    rgba(255,255,255,.055);
}

.live-stat span{
  display:block;

  margin-bottom:7px;

  color:
    #6e7b74;

  font-size:10px;

  font-weight:800;

  text-transform:uppercase;

  letter-spacing:1.2px;
}

.live-stat strong{
  font-size:18px;
}

.presale-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:12px;

  margin-top:20px;
}

.stat{
  padding:17px;

  border-radius:13px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid
    rgba(255,255,255,.055);
}

.stat span{
  display:block;

  margin-bottom:7px;

  color:
    var(--muted);

  font-size:10px;

  font-weight:800;

  text-transform:uppercase;

  letter-spacing:1px;
}

.stat strong{
  font-size:17px;
}

/* =========================================================
   SECTIONS
========================================================= */

.content-section{
  padding:
    130px 0;
}

.section-heading{
  margin-bottom:55px;

  text-align:center;
}

.section-heading > span{
  color:
    var(--green);

  font-size:11px;

  font-weight:950;

  text-transform:uppercase;

  letter-spacing:3px;
}

.section-heading h2{
  margin-top:13px;

  font-size:
    clamp(
      36px,
      5vw,
      60px
    );

  letter-spacing:-3px;
}

.section-heading p{
  max-width:650px;

  margin:
    18px auto 0;

  color:
    var(--muted);

  line-height:1.75;
}

.glass-card{
  position:relative;

  overflow:hidden;

  padding:30px;

  border:
    1px solid
    rgba(255,255,255,.075);

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.034),
      rgba(255,255,255,.012)
    );

  backdrop-filter:
    blur(18px);

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.26);
}

.glass-card::before{
  content:"";

  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(0,255,136,.42),
      transparent
    );
}

/* =========================================================
   TOKENOMICS
========================================================= */

.tokenomics-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:22px;
}

.allocation{
  display:flex;

  align-items:center;

  gap:17px;

  padding:
    17px 0;

  border-bottom:
    1px solid
    rgba(255,255,255,.055);
}

.allocation:last-child{
  border-bottom:0;
}

.allocation-dot{
  width:10px;
  height:10px;

  flex:0 0 auto;

  border-radius:50%;

  background:
    var(--green);

  box-shadow:
    0 0 15px
    rgba(0,255,136,.65);
}

.allocation-name{
  flex:1;
}

.allocation-name strong{
  display:block;

  margin-bottom:4px;
}

.allocation-name small{
  color:
    var(--muted);
}

.allocation-percent{
  color:
    var(--green3);

  font-weight:1000;
}

.supply{
  min-height:350px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;
}

.supply-number{
  font-size:
    clamp(
      55px,
      7vw,
      92px
    );

  font-weight:1000;

  background:
    linear-gradient(
      90deg,
      white,
      var(--green)
    );

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;
}

.supply-label{
  color:
    var(--muted);
}

/* =========================================================
   BUY
========================================================= */

.buy-section{
  max-width:700px;

  margin:auto;
}

.buy-box h3{
  margin-bottom:7px;

  font-size:29px;
}

.buy-box > p{
  margin-bottom:25px;

  color:
    var(--muted);
}

.price-card{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:20px;

  padding:14px;

  border-radius:12px;

  background:
    rgba(0,255,136,.035);

  border:
    1px solid
    rgba(0,255,136,.1);
}

.price-card span{
  color:
    #728078;

  font-size:11px;

  text-transform:uppercase;

  letter-spacing:1px;
}

.price-card strong{
  color:
    var(--green3);
}

.input-group{
  margin-bottom:15px;
}

.input-group label{
  display:flex;

  justify-content:space-between;

  margin-bottom:8px;

  color:
    #b7c3bc;

  font-size:11px;

  font-weight:800;
}

.input-wrap{
  display:flex;

  align-items:center;

  overflow:hidden;

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius:13px;

  background:
    rgba(255,255,255,.025);

  transition:.2s;
}

.input-wrap:focus-within{
  border-color:
    rgba(0,255,136,.35);

  box-shadow:
    0 0 25px
    rgba(0,255,136,.07);
}

.input-wrap input{
  width:100%;

  min-width:0;

  flex:1;

  padding:17px;

  border:0;

  outline:0;

  color:white;

  background:
    transparent;

  font-size:18px;

  font-weight:800;
}

.input-wrap input::placeholder{
  color:#4e5b54;
}

.input-symbol{
  padding:
    0 17px;

  color:
    var(--green);

  font-size:12px;

  font-weight:950;
}

.purchase-preview{
  margin-top:17px;

  padding:15px;

  border-radius:12px;

  background:
    rgba(255,255,255,.02);

  border:
    1px solid
    rgba(255,255,255,.055);

  display:grid;

  gap:10px;
}

.preview-row{
  display:flex;

  justify-content:space-between;

  gap:15px;

  font-size:12px;
}

.preview-row span{
  color:
    #69766f;
}

.preview-row strong{
  text-align:right;
}

.buy-submit{
  position:relative;

  overflow:hidden;

  width:100%;

  margin-top:18px;

  padding:17px;

  border:0;

  border-radius:13px;

  color:#001208;

  font-weight:1000;

  cursor:pointer;

  background:
    linear-gradient(
      90deg,
      #c0ffde,
      var(--green)
    );

  box-shadow:
    0 15px 45px
    rgba(0,255,136,.17);

  transition:.25s;
}

.buy-submit::after{
  content:"";

  position:absolute;

  left:-60%;
  top:0;

  width:45%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.7),
      transparent
    );

  transform:
    skewX(-20deg);

  transition:.7s;
}

.buy-submit:hover{
  transform:
    translateY(-2px);

  box-shadow:
    0 20px 55px
    rgba(0,255,136,.29);
}

.buy-submit:hover::after{
  left:120%;
}

.buy-submit:disabled{
  opacity:.5;

  cursor:not-allowed;

  transform:none;
}

.wallet-status{
  display:none;

  margin-top:15px;

  padding:14px;

  border-radius:12px;

  color:
    #b7ffda;

  background:
    rgba(0,255,136,.04);

  border:
    1px solid
    rgba(0,255,136,.12);

  font-size:12px;

  line-height:1.5;

  text-align:center;
}

.wallet-status.show{
  display:block;
}

.wallet-status.error{
  color:#ff9eb1;

  background:
    rgba(255,82,111,.05);

  border-color:
    rgba(255,82,111,.18);
}

/* =========================================================
   ROADMAP
========================================================= */

.roadmap{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:18px;
}

.roadmap-card{
  min-height:280px;
}

.phase{
  color:
    var(--green);

  font-size:10px;

  font-weight:950;

  text-transform:uppercase;

  letter-spacing:2px;
}

.roadmap-card h3{
  margin:
    12px 0;

  font-size:25px;
}

.roadmap-card p{
  color:
    var(--muted);

  line-height:1.7;
}

.roadmap-card ul{
  margin-top:20px;

  list-style:none;
}

.roadmap-card li{
  margin:
    10px 0;

  color:
    #c8d4ce;

  font-size:13px;
}

.roadmap-card li::before{
  content:"◆";

  margin-right:9px;

  color:
    var(--green);

  font-size:7px;
}

/* =========================================================
   FAQ
========================================================= */

.faq{
  max-width:850px;

  margin:auto;
}

details{
  margin-bottom:10px;

  overflow:hidden;

  border:
    1px solid
    rgba(255,255,255,.07);

  border-radius:13px;

  background:
    rgba(255,255,255,.02);
}

summary{
  padding:20px;

  cursor:pointer;

  list-style:none;

  font-weight:800;
}

summary::-webkit-details-marker{
  display:none;
}

details p{
  padding:
    0 20px 20px;

  color:
    var(--muted);

  line-height:1.7;

  font-size:14px;
}
