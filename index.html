<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anonymous Token — Solana</title>

<meta
  name="description"
  content="Anonymous Token — a community-driven token built on Solana."
>

<style>

:root{
  --black:#020403;
  --black2:#050806;
  --panel:#080c0a;
  --panel2:#0c120f;

  --green:#00ff88;
  --green2:#00c96b;
  --green3:#8affc6;

  --white:#f5fff9;
  --text:#dce8e1;
  --muted:#7c8b84;

  --border:rgba(0,255,136,.14);
  --border2:rgba(255,255,255,.07);

  --danger:#ff4d6d;

  --max:1180px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(0,255,136,.11),
      transparent 25%
    ),
    radial-gradient(
      circle at 85% 20%,
      rgba(0,255,136,.06),
      transparent 24%
    ),
    linear-gradient(
      180deg,
      #020403 0%,
      #030604 45%,
      #010201 100%
    );

  color:var(--white);
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background-image:
    linear-gradient(
      rgba(0,255,136,.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0,255,136,.025) 1px,
      transparent 1px
    );

  background-size:55px 55px;

  mask-image:
    linear-gradient(
      to bottom,
      black,
      transparent 90%
    );

  z-index:-5;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(
      circle at center,
      transparent 45%,
      rgba(0,0,0,.72) 100%
    );

  z-index:-4;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.container{
  width:min(
    var(--max),
    calc(100% - 40px)
  );

  margin:auto;
}

/* =========================================
   PARTICLES
========================================= */

#particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-3;
  overflow:hidden;
}

.particle{
  position:absolute;
  width:2px;
  height:2px;
  background:var(--green);
  border-radius:50%;
  opacity:.45;

  box-shadow:
    0 0 10px var(--green);

  animation:
    floatParticle
    linear
    infinite;
}

@keyframes floatParticle{

  from{
    transform:
      translateY(110vh)
      translateX(0);
  }

  to{
    transform:
      translateY(-20vh)
      translateX(80px);
  }

}

/* =========================================
   HEADER
========================================= */

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;

  z-index:1000;

  border-bottom:
    1px solid
    rgba(255,255,255,.055);

  background:
    rgba(2,4,3,.72);

  backdrop-filter:
    blur(24px);
}

.nav{
  height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;

  font-size:18px;
  font-weight:900;

  letter-spacing:-.5px;
}

.logo-mark{
  width:42px;
  height:42px;

  display:grid;
  place-items:center;

  border-radius:11px;

  color:#00150b;

  font-size:18px;
  font-weight:1000;

  background:
    linear-gradient(
      145deg,
      #a5ffd3,
      var(--green),
      #008e4d
    );

  box-shadow:
    0 0 25px
    rgba(0,255,136,.32);

  position:relative;

  overflow:hidden;
}

.logo-mark::after{
  content:"";
  position:absolute;

  width:60px;
  height:10px;

  background:rgba(255,255,255,.55);

  transform:
    rotate(-45deg)
    translateX(-50px);

  animation:
    logoShine
    4s
    infinite;
}

@keyframes logoShine{

  0%,65%{
    transform:
      rotate(-45deg)
      translateX(-60px);
  }

  85%,100%{
    transform:
      rotate(-45deg)
      translateX(70px);
  }

}

nav{
  display:flex;
  align-items:center;
  gap:30px;
}

nav a{
  color:#89978f;
  font-size:13px;
  font-weight:700;

  transition:.25s ease;
}

nav a:hover{
  color:var(--green);
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.language{
  border:
    1px solid
    rgba(255,255,255,.08);

  background:
    rgba(255,255,255,.035);

  color:white;

  padding:10px 12px;

  border-radius:10px;

  cursor:pointer;
}

.wallet-btn{
  border:0;

  cursor:pointer;

  color:#00130a;

  font-weight:900;

  padding:12px 18px;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      #b6ffda,
      var(--green)
    );

  box-shadow:
    0 0 25px
    rgba(0,255,136,.17);

  transition:.25s;
}

.wallet-btn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 0 40px
    rgba(0,255,136,.32);
}

/* =========================================
   HERO
========================================= */

.hero{
  min-height:900px;

  padding-top:160px;

  display:flex;
  align-items:center;

  position:relative;
}

.hero-content{
  width:100%;

  text-align:center;

  position:relative;

  z-index:3;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:9px;

  padding:8px 14px;

  border:
    1px solid
    rgba(0,255,136,.2);

  background:
    rgba(0,255,136,.045);

  border-radius:999px;

  color:#b4ffda;

  font-size:12px;
  font-weight:800;

  letter-spacing:1px;
  text-transform:uppercase;

  animation:
    fadeUp
    .8s
    both;
}

.status-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 14px
    var(--green);

  animation:
    pulse
    1.7s
    infinite;
}

@keyframes pulse{

  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.55;
    transform:scale(.72);
  }

}

.hero h1{
  max-width:1050px;

  margin:30px auto 0;

  font-size:
    clamp(
      52px,
      9vw,
      105px
    );

  line-height:.88;

  letter-spacing:
    -6px;

  font-weight:1000;

  animation:
    fadeUp
    .95s
    both;
}

.hero h1 span{
  display:block;
}

.green-text{
  background:
    linear-gradient(
      90deg,
      #eafff3,
      #9affc8 35%,
      var(--green) 70%,
      #52ffa8
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  text-shadow:
    0 0 45px
    rgba(0,255,136,.15);
}

.hero-description{
  max-width:680px;

  margin:32px auto 0;

  color:var(--muted);

  font-size:17px;

  line-height:1.8;

  animation:
    fadeUp
    1.05s
    both;
}

.hero-buttons{
  margin-top:38px;

  display:flex;

  justify-content:center;

  gap:13px;

  flex-wrap:wrap;

  animation:
    fadeUp
    1.15s
    both;
}

.primary-btn,
.secondary-btn{

  border-radius:13px;

  padding:16px 26px;

  font-weight:900;

  cursor:pointer;

  transition:.25s;

}

.primary-btn{

  color:#00150b;

  background:
    linear-gradient(
      135deg,
      #c0ffdf,
      var(--green)
    );

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 12px 50px
    rgba(0,255,136,.2);
}

.primary-btn:hover{
  transform:translateY(-3px);

  box-shadow:
    0 18px 60px
    rgba(0,255,136,.32);
}

.secondary-btn{

  color:white;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid
    rgba(255,255,255,.09);
}

.secondary-btn:hover{
  border-color:
    rgba(0,255,136,.3);

  color:var(--green3);
}

/* =========================================
   MASK / ORBIT
========================================= */

.mask-stage{

  position:absolute;

  width:650px;
  height:650px;

  left:50%;
  top:52%;

  transform:
    translate(-50%,-50%);

  z-index:-1;

  pointer-events:none;
}

.orbit{
  position:absolute;
  inset:0;

  border:
    1px solid
    rgba(0,255,136,.08);

  border-radius:50%;

  animation:
    rotate
    24s
    linear
    infinite;
}

.orbit::before,
.orbit::after{

  content:"";

  position:absolute;

  border-radius:50%;
}

.orbit::before{

  width:9px;
  height:9px;

  top:14%;
  left:50%;

  background:var(--green);

  box-shadow:
    0 0 30px
    var(--green);
}

.orbit::after{

  width:6px;
  height:6px;

  right:10%;
  bottom:25%;

  background:#aaffd1;

  box-shadow:
    0 0 22px
    var(--green);
}

.mask{

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  width:310px;
  height:250px;

  opacity:.13;

  filter:
    drop-shadow(
      0 0 35px
      rgba(0,255,136,.8)
    );

  animation:
    maskFloat
    5s
    ease-in-out
    infinite;
}

/*
  Stylized serious mask.
  It is drawn entirely with CSS/SVG-like geometry
  so no external image is required.
*/

.mask-face{

  position:absolute;

  inset:20px;

  background:
    linear-gradient(
      135deg,
      rgba(180,255,215,.8),
      rgba(0,255,136,.18)
    );

  clip-path:
    polygon(
      18% 8%,
      50% 0%,
      82% 8%,
      100% 35%,
      88% 82%,
      67% 100%,
      33% 100%,
      12% 82%,
      0 35%
    );

  border-radius:30px;
}

.eye{
  position:absolute;

  width:85px;
  height:28px;

  top:92px;

  background:#00140b;

  transform:
    skewY(-10deg);

  box-shadow:
    0 0 20px
    var(--green);
}

.eye.left{
  left:48px;
}

.eye.right{
  right:48px;

  transform:
    scaleX(-1)
    skewY(-10deg);
}

.mask-mouth{

  position:absolute;

  width:110px;
  height:36px;

  left:50%;
  bottom:55px;

  transform:
    translateX(-50%);

  border-bottom:
    4px solid
    #00140b;

  border-radius:
    0 0 70px 70px;
}

@keyframes maskFloat{

  0%,100%{
    transform:
      translate(-50%,-50%)
      translateY(0);
  }

  50%{
    transform:
      translate(-50%,-50%)
      translateY(-15px);
  }

}

@keyframes rotate{

  from{
    transform:
      translate(-50%,-50%)
      rotate(0);
  }

  to{
    transform:
      translate(-50%,-50%)
      rotate(360deg);
  }

}

/* =========================================
   PRESALE
========================================= */

.presale-wrap{
  margin-top:-70px;

  position:relative;

  z-index:10;
}

.presale{

  padding:32px;

  border-radius:22px;

  border:
    1px solid
    rgba(0,255,136,.15);

  background:
    linear-gradient(
      135deg,
      rgba(0,255,136,.055),
      rgba(255,255,255,.02)
    ),
    rgba(6,10,8,.88);

  backdrop-filter:
    blur(25px);

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.5);
}

.presale-top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  margin-bottom:24px;
}

.presale-title{

  font-size:24px;

  font-weight:900;
}

.presale-subtitle{

  color:var(--muted);

  font-size:13px;

  margin-top:7px;
}

.live{

  display:flex;

  align-items:center;

  gap:8px;

  color:var(--green);

  font-size:12px;

  font-weight:900;

  letter-spacing:1px;
}

.progress-info{

  display:flex;

  justify-content:space-between;

  color:var(--muted);

  font-size:13px;

  margin-bottom:9px;
}

.progress{

  height:10px;

  width:100%;

  background:
    rgba(255,255,255,.06);

  border-radius:999px;

  overflow:hidden;
}

.progress-bar{

  width:38%;

  height:100%;

  background:
    linear-gradient(
      90deg,
      #00a95b,
      var(--green),
      #aaffd1
    );

  box-shadow:
    0 0 25px
    rgba(0,255,136,.55);

  border-radius:inherit;
}

.presale-grid{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:12px;

  margin-top:22px;
}

.stat{

  padding:17px;

  border-radius:13px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid
    rgba(255,255,255,.055);
}

.stat span{

  display:block;

  color:var(--muted);

  font-size:11px;

  text-transform:uppercase;

  letter-spacing:1px;

  margin-bottom:7px;
}

.stat strong{

  font-size:17px;
}

/* =========================================
   SECTIONS
========================================= */

section.content-section{
  padding:130px 0;
}

.section-heading{

  text-align:center;

  margin-bottom:55px;
}

.section-heading span{

  color:var(--green);

  font-size:11px;

  font-weight:900;

  text-transform:uppercase;

  letter-spacing:3px;
}

.section-heading h2{

  font-size:
    clamp(
      36px,
      5vw,
      60px
    );

  letter-spacing:-3px;

  margin-top:13px;
}

.section-heading p{

  color:var(--muted);

  max-width:650px;

  margin:18px auto 0;

  line-height:1.75;
}

/* =========================================
   GLASS
========================================= */

.glass-card{

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.015)
    );

  border:
    1px solid
    rgba(255,255,255,.075);

  border-radius:20px;

  padding:30px;

  backdrop-filter:
    blur(18px);

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.25);

  position:relative;

  overflow:hidden;
}

.glass-card::before{

  content:"";

  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(0,255,136,.4),
      transparent
    );

  opacity:.45;
}

/* =========================================
   TOKENOMICS
========================================= */

.tokenomics-grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:22px;
}

.allocation{

  display:flex;

  align-items:center;

  gap:17px;

  padding:17px 0;

  border-bottom:
    1px solid
    rgba(255,255,255,.055);
}

.allocation:last-child{
  border-bottom:0;
}

.allocation-dot{

  width:10px;
  height:10px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 16px
    rgba(0,255,136,.7);
}

.allocation-name{
  flex:1;
}

.allocation-name strong{

  display:block;

  margin-bottom:4px;
}

.allocation-name small{
  color:var(--muted);
}

.allocation-percent{

  color:var(--green3);

  font-weight:1000;
}

.supply{

  min-height:350px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  text-align:center;
}

.supply-number{

  font-size:
    clamp(
      50px,
      7vw,
      90px
    );

  font-weight:1000;

  background:
    linear-gradient(
      90deg,
      white,
      var(--green)
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}

.supply-label{
  color:var(--muted);
}

/* =========================================
   BUY
========================================= */

.buy-section{

  max-width:680px;

  margin:auto;
}

.buy-box h3{

  font-size:28px;

  margin-bottom:8px;
}

.buy-box > p{
  color:var(--muted);
  margin-bottom:25px;
}

.input-group{
  margin-bottom:15px;
}

.input-group label{

  display:block;

  color:#b6c4bd;

  font-size:12px;

  font-weight:700;

  margin-bottom:8px;
}

.input-wrap{

  display:flex;

  align-items:center;

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius:13px;

  background:
    rgba(255,255,255,.025);

  overflow:hidden;

  transition:.2s;
}

.input-wrap:focus-within{

  border-color:
    rgba(0,255,136,.35);

  box-shadow:
    0 0 25px
    rgba(0,255,136,.07);
}

.input-wrap input{

  flex:1;

  min-width:0;

  border:0;
  outline:0;

  background:transparent;

  color:white;

  padding:16px;
}

.input-symbol{

  padding:0 16px;

  color:var(--green);

  font-weight:900;
}

.buy-submit{

  width:100%;

  margin-top:10px;

  padding:17px;

  border:0;

  border-radius:13px;

  cursor:pointer;

  font-weight:1000;

  color:#00150b;

  background:
    linear-gradient(
      90deg,
      #b8ffda,
      var(--green)
    );

  box-shadow:
    0 15px 40px
    rgba(0,255,136,.16);

  transition:.25s;
}

.buy-submit:hover{

  transform:translateY(-2px);

  box-shadow:
    0 18px 55px
    rgba(0,255,136,.3);
}

.buy-submit:disabled{

  opacity:.5;

  cursor:not-allowed;

  transform:none;
}

/* =========================================
   WALLET STATUS
========================================= */

.wallet-status{

  display:none;

  margin-top:15px;

  padding:14px;

  border-radius:12px;

  background:
    rgba(0,255,136,.045);

  border:
    1px solid
    rgba(0,255,136,.12);

  color:#b7ffda;

  font-size:13px;

  text-align:center;
}

.wallet-status.show{
  display:block;
}

/* =========================================
   ROADMAP
========================================= */

.roadmap{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:18px;
}

.roadmap-card{
  min-height:280px;
}

.phase{

  color:var(--green);

  font-size:11px;

  font-weight:900;

  text-transform:uppercase;

  letter-spacing:2px;
}

.roadmap-card h3{

  font-size:25px;

  margin:12px 0;
}

.roadmap-card p{

  color:var(--muted);

  line-height:1.7;
}

.roadmap-card ul{

  list-style:none;

  margin-top:20px;
}

.roadmap-card li{

  color:#c8d4ce;

  font-size:13px;

  margin:10px 0;
}

.roadmap-card li::before{

  content:"◆";

  color:var(--green);

  font-size:7px;

  margin-right:9px;
}

/* =========================================
   FAQ
========================================= */

.faq{

  max-width:850px;

  margin:auto;
}

details{

  border:
    1px solid
    rgba(255,255,255,.07);

  border-radius:13px;

  background:
    rgba(255,255,255,.02);

  margin-bottom:10px;

  overflow:hidden;
}

summary{

  cursor:pointer;

  padding:20px;

  font-weight:800;

  list-style:none;
}

summary::-webkit-details-marker{
  display:none;
}

details p{

  padding:
    0 20px 20px;

  color:var(--muted);

  line-height:1.7;

  font-size:14px;
}

/* =========================================
   FOOTER
========================================= */

footer{

  border-top:
    1px solid
    rgba(255,255,255,.06);

  padding:40px 0;

  color:var(--muted);

  font-size:13px;
}

.footer-inner{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;
}

.socials{

  display:flex;

  gap:18px;
}

.socials a:hover{
  color:var(--green);
}

/* =========================================
   MODAL
========================================= */

.modal{

  position:fixed;

  inset:0;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,0,0,.78);

  backdrop-filter:
    blur(14px);

  z-index:5000;
}

.modal.active{
  display:flex;
}

.modal-box{

  width:min(
    440px,
    100%
  );

  padding:28px;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      #0b110e,
      #050806
    );

  border:
    1px solid
    rgba(0,255,136,.16);

  box-shadow:
    0 40px 120px
