<style>
:root{
  --black:#020403;
  --black2:#050806;
  --panel:rgba(5,12,8,.78);
  --green:#00ff66;
  --green2:#00cc52;
  --green3:#72ff9d;
  --darkgreen:#06351b;
  --white:#eafff0;
  --muted:#6c8877;
  --line:rgba(0,255,102,.16);
  --red:#ff3158;
  --max:1200px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:
    radial-gradient(circle at 50% 15%,rgba(0,255,102,.10),transparent 32%),
    radial-gradient(circle at 10% 80%,rgba(0,255,102,.06),transparent 25%),
    var(--black);
  color:var(--white);
  font-family:Inter,Arial,sans-serif;
  overflow-x:hidden;
}

/* MATRIX BACKGROUND */

#matrix{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  opacity:.13;
  pointer-events:none;
  z-index:-5;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:999;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.015) 0,
      rgba(255,255,255,.015) 1px,
      transparent 1px,
      transparent 4px
    );
  mix-blend-mode:overlay;
  opacity:.35;
}

a{
  color:inherit;
  text-decoration:none;
}

button,input{
  font:inherit;
}

.container{
  width:min(var(--max),calc(100% - 40px));
  margin:auto;
}

/* HEADER */

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:100;
  border-bottom:1px solid var(--line);
  background:rgba(2,4,3,.72);
  backdrop-filter:blur(18px);
}

.nav{
  height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}

.logo-icon{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border:1px solid var(--green);
  background:#020803;
  color:var(--green);
  box-shadow:
    0 0 15px rgba(0,255,102,.35),
    inset 0 0 15px rgba(0,255,102,.08);
  font-size:19px;
  position:relative;
}

.logo-icon::after{
  content:"";
  position:absolute;
  inset:4px;
  border:1px solid rgba(0,255,102,.2);
}

nav{
  display:flex;
  gap:30px;
}

nav a{
  color:#8ba996;
  font-family:monospace;
  font-size:13px;
  text-transform:uppercase;
  transition:.2s;
}

nav a:hover{
  color:var(--green);
  text-shadow:0 0 12px var(--green);
}

.actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.lang{
  border:1px solid var(--line);
  background:#061009;
  color:var(--green);
  padding:10px 12px;
  cursor:pointer;
}

.connect{
  border:1px solid var(--green);
  background:rgba(0,255,102,.08);
  color:var(--green);
  padding:11px 16px;
  cursor:pointer;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
  box-shadow:0 0 20px rgba(0,255,102,.08);
  transition:.2s;
}

.connect:hover{
  background:var(--green);
  color:#001508;
  box-shadow:0 0 30px rgba(0,255,102,.4);
}

/* HERO */

.hero{
  min-height:920px;
  padding-top:150px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hero-content{
  text-align:center;
  position:relative;
  z-index:2;
}

.system{
  color:var(--green);
  font:12px monospace;
  letter-spacing:3px;
  margin-bottom:22px;
}

.system::before{
  content:"[ ONLINE ] ";
  color:var(--green3);
}

.hero h1{
  font-family:monospace;
  font-size:clamp(52px,9vw,110px);
  line-height:.9;
  letter-spacing:-7px;
  text-transform:uppercase;
  text-shadow:
    0 0 12px rgba(0,255,102,.35),
    0 0 60px rgba(0,255,102,.08);
}

.glitch{
  position:relative;
  display:inline-block;
  color:var(--white);
}

.glitch::before,
.glitch::after{
  content:attr(data-text);
  position:absolute;
  left:0;
  top:0;
  width:100%;
  overflow:hidden;
  opacity:.7;
}

.glitch::before{
  color:#00ff66;
  transform:translate(3px,0);
  clip-path:inset(20% 0 55% 0);

animation:glitch1 3s infinite linear alternate-reverse;
}

.glitch::after{
  color:#ffffff;
  transform:translate(-3px,0);
  clip-path:inset(60% 0 10% 0);
  animation:glitch2 2.2s infinite linear alternate-reverse;
}

.hero-green{
  color:var(--green);
  display:block;
}

.hero-description{
  max-width:700px;
  margin:30px auto;
  color:#789384;
  font:16px/1.8 monospace;
}

.hero-buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:30px;
}

.btn{
  padding:16px 25px;
  cursor:pointer;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
  transition:.2s;
}

.btn-primary{
  border:1px solid var(--green);
  background:var(--green);
  color:#001508;
  box-shadow:0 0 30px rgba(0,255,102,.2);
}

.btn-primary:hover{
  box-shadow:0 0 45px rgba(0,255,102,.5);
  transform:translateY(-2px);
}

.btn-secondary{
  border:1px solid var(--line);
  background:rgba(0,255,102,.04);
  color:var(--green);
}

.btn-secondary:hover{
  background:rgba(0,255,102,.1);
}

/* MASK */

.mask-stage{
  position:absolute;
  width:600px;
  height:600px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  opacity:.10;
  pointer-events:none;
  z-index:-1;
}

.mask{
  position:absolute;
  width:370px;
  height:420px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border:3px solid var(--green);
  border-radius:47% 47% 43% 43%;
  box-shadow:
    0 0 30px rgba(0,255,102,.35),
    inset 0 0 60px rgba(0,255,102,.07);
}

.mask::before{
  content:"";
  position:absolute;
  left:70px;
  right:70px;
  top:125px;
  height:42px;
  border-top:3px solid var(--green);
  border-bottom:3px solid var(--green);
  transform:skewY(-4deg);
  box-shadow:0 0 18px rgba(0,255,102,.3);
}

.eye{
  position:absolute;
  top:140px;
  width:85px;
  height:28px;
  border-top:3px solid var(--green);
  transform:rotate(-7deg);
}

.eye.left{
  left:58px;
}

.eye.right{
  right:58px;
  transform:rotate(7deg);
}

.nose{
  position:absolute;
  top:185px;
  left:50%;
  width:25px;
  height:45px;
  border-left:3px solid var(--green);
  border-bottom:3px solid var(--green);
  transform:translateX(-50%) rotate(-8deg);
}

.mustache{
  position:absolute;
  top:260px;
  left:50%;
  width:190px;
  height:45px;
  transform:translateX(-50%);
  border-bottom:4px solid var(--green);
  border-radius:0 0 50% 50%;
}

.mouth{
  position:absolute;
  top:330px;
  left:50%;
  width:115px;
  height:35px;
  transform:translateX(-50%);
  border-top:3px solid var(--green);
  border-radius:50%;
}

/* TERMINAL */

.terminal{
  width:min(900px,100%);
  margin:70px auto 0;
  border:1px solid var(--line);
  background:rgba(1,6,3,.86);
  box-shadow:
    0 0 50px rgba(0,255,102,.08),
    inset 0 0 40px rgba(0,255,102,.025);
  text-align:left;
  font:13px/1.8 monospace;
}

.terminal-top{
  height:38px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 13px;
  border-bottom:1px solid var(--line);
  color:#587261;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#173a25;
}

.terminal-body{
  padding:18px;
  color:#659477;
}

.terminal-line{
  margin:5px 0;
}

.terminal-line span{
  color:var(--green);
}

.cursor{
  display:inline-block;
  width:7px;
  height:14px;
  background:var(--green);
  vertical-align:-2px;
  animation:blink 1s infinite;
}

/* PANELS */

.section{
  padding:120px 0;
}

.section-title{
  text-align:center;
  margin-bottom:55px;
}

.section-title .small{
  color:var(--green);
  font:12px monospace;
  letter-spacing:3px;
}

.section-title h2{
  margin-top:12px;
  font:900 clamp(34px,5vw,62px)/1 monospace;
  text-transform:uppercase;
}

.section-title p{
  max-width:650px;
  margin:18px auto 0;
  color:var(--muted);
  line-height:1.7;
}

.live{
  color:var(--green);

.progress-info{

.progress{

.progress-bar{

  animation:pulsebar 2s infinite alternate;
}
